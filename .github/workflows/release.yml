name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a semantic version such as v0.1.0" >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "$RELEASE_VERSION already exists" >&2
            exit 1
          fi

      - name: Test
        run: |
          go test ./...
          pnpm test:web
          pnpm typecheck

      - name: Test browser
        run: pnpm test:browser

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          pnpm build:web
          git diff --exit-code -- internal/web/dist
          go build ./...

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_VERSION" \
            --generate-notes
